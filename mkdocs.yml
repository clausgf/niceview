site_name: niceview
site_description: NiceGUI adapter layer — forms and grids generated from Pydantic models
site_url: https://clausgf.github.io/niceview/
repo_url: https://github.com/clausgf/niceview
repo_name: clausgf/niceview
edit_uri: edit/main/docs/
copyright: MIT licensed

docs_dir: docs

# Not pages: the screenshot tooling and the note on how the images are made. Both live under
# docs/ because that is what they are about, but neither belongs in the built site.
exclude_docs: |
  screenshots/
  img/README.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections     # the top-level groups below stay expanded
    - navigation.top
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    # The site follows the reader's system theme, with a switch for either direction —
    # the same rule the library's own widgets follow.
    - media: "(prefers-color-scheme)"
      toggle: {icon: material/brightness-auto, name: Follow the system theme}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: {icon: material/brightness-4, name: Switch to light mode}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          # Inventories of the libraries niceview sits between: a type annotation that names
          # BaseModel or a NiceGUI element links to their documentation instead of dead-ending.
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
          options:
            docstring_style: null       # the docstrings are prose, not a sectioned format
            members_order: source       # the order the module argues in, not the alphabet
            filters: ["!^_"]            # private names, except where a page asks for them
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            heading_level: 2

# A link into another page is checked, not just rendered: the docs cross-reference each other
# heavily, and a heading renamed in one file must not quietly rot the links in three others.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's slug rules, so that '#modelgrid--modelgridinlineedit' resolves both here and
      # in the same file read on GitHub. Python-Markdown's own slugger collapses the double
      # dash and would silently break every such link in one of the two places.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Overview: index.md
  - Guide:
      - Concepts: CONCEPT.md
      - Components: components.md
      - Data adapters: adapters.md
      - Field types: field-types.md
      - Field metadata comparison: field-metadata-comparison.md
      - Dialogs: dialogs.md
  - API reference:
      - Forms: api/forms.md
      - Grids and lists: api/grids.md
      - Fields and widgets: api/fields.md
      - Data adapters: api/adapters.md
      - Styling and texts: api/style.md
      - Keyword options: api/options.md
  - About:
      - Design decisions: DESIGN.md
      - Changelog: CHANGELOG.md
