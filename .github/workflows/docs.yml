name: Docs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Pages needs to read the repository and mint an id-token for the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer commit waits for the running one rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        # The docs group plus the package itself (mkdocstrings imports niceview to read it),
        # but not the test tooling — nothing here runs a test.
        run: uv sync --no-default-groups --group docs

      - name: Build the site
        # --strict turns a broken link or a missing reference into a failed build.
        run: uv run mkdocs build --strict

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Only what is on main goes live; a pull request builds (and must build) but does not deploy.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
